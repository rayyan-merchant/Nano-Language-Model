[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-language-model"
version = "0.1.0"
description = "Explicit GPT architecture for a controlled Tiny Shakespeare study"
requires-python = ">=3.10"
dependencies = ["torch==2.5.1", "numpy==1.26.4", "tokenizers==0.21.0", "matplotlib==3.9.4"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
bpe = ["tokenizers==0.21.0"]
api = ["fastapi==0.115.6", "uvicorn==0.34.0"]
plots = ["matplotlib==3.9.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
