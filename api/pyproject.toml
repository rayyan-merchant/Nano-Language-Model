[build-system]
requires=["setuptools==75.6.0"]
build-backend="setuptools.build_meta"
[project]
name="nanolm-studio-serving"
version="0.1.0"
requires-python="==3.12.*"
dependencies=[
  "torch==2.5.1+cpu",
  "numpy==1.26.4",
  "tokenizers==0.21.0",
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "certifi==2026.7.22",
  "click==8.5.0",
  "exceptiongroup==1.3.1",
  "fastapi==0.143.1",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.20",
  "opentelemetry-api==1.45.1",
  "psutil==7.0.0",
  "pydantic==2.10.6",
  "pydantic-core==2.27.2",
  "safetensors==0.8.0",
  "starlette==1.7.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "uvicorn==0.34.0"
]
[tool.uv]
package=false
[tool.vercel]
entrypoint="app:app"
[[tool.uv.index]]
name="pytorch-cpu"
url="https://download.pytorch.org/whl/cpu"
explicit=true
[tool.uv.sources]
torch={index="pytorch-cpu"}
